name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows:
    name: Build, tests (Windows), portable ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore PCDoc.slnx --locked-mode
      - name: Build
        run: dotnet build PCDoc.slnx -c Release --no-restore
      - name: Tests (all, including Windows integration tests)
        if: matrix.rid == 'win-x64'
        run: dotnet test PCDoc.slnx -c Release --no-build --logger trx --results-directory TestResults
      - name: Vulnerable packages
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $out = dotnet list PCDoc.slnx package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Output $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }
      - name: Publish portable ${{ matrix.rid }}
        run: >
          dotnet publish src/PCDoc.App/PCDoc.App.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true
          -o out/${{ matrix.rid }}
      - name: Smoke test (the published app starts and stays up)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out/win-x64/PCDoc.exe" -PassThru
          Start-Sleep -Seconds 20
          $log = Get-ChildItem "$env:LOCALAPPDATA/PCDoc/logs" -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Get-Content $log.FullName }
          if ($p.HasExited) { Write-Error "PCDoc exited during startup (code $($p.ExitCode))"; exit 1 }
          if (-not $log -or -not (Select-String -Path $log.FullName -Pattern 'Window shown')) { Write-Error "Main window was not shown"; exit 1 }
          if (Select-String -Path $log.FullName -Pattern '\[(ERR|FTL)\]') { Write-Error "Errors in the startup log"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.3.2
          dotnet CycloneDX src/PCDoc.App/PCDoc.App.csproj -o out/${{ matrix.rid }} -fn sbom.cdx.json -j
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PCDoc-portable-${{ matrix.rid }}
          path: out/${{ matrix.rid }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.rid == 'win-x64' && always()
        with:
          name: test-results
          path: TestResults

  linux:
    name: Tests (cross-platform projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Tests (net10.0 projects)
        run: |
          for p in tests/PCDoc.Core.Tests tests/PCDoc.Modules.System.Tests tests/PCDoc.Presentation.Tests; do
            dotnet test "$p" --filter "Category!=Windows" || exit 1
          done
