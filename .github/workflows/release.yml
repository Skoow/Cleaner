name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build:
    name: Build, sign and package ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    env:
      # Signature (Azure Trusted Signing) seulement si les secrets sont configurés ; sinon la version n'est pas signée
      # et PCDoc propose alors la page de téléchargement au lieu d'installer la mise à jour tout seul.
      # Les secrets ne sont donnés qu'aux deux étapes de signature (jamais à la compilation ni aux tests).
      SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && 'true' || 'false' }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Version from the tag
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { Write-Error "Bad tag $version"; exit 1 }
          "VERSION=$version" >> $env:GITHUB_ENV
          "MSI_VERSION=$($version.Split('-')[0])" >> $env:GITHUB_ENV
          "ARCH=$('${{ matrix.rid }}'.Replace('win-', ''))" >> $env:GITHUB_ENV
      - run: dotnet restore PCDoc.slnx --locked-mode
      - run: dotnet build PCDoc.slnx -c Release --no-restore -p:Version=${{ env.VERSION }}
      - name: Tests
        if: matrix.rid == 'win-x64'
        run: dotnet test PCDoc.slnx -c Release --no-build
      - name: Publish portable
        run: >
          dotnet publish src/PCDoc.App/PCDoc.App.csproj -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true
          -p:Version=${{ env.VERSION }} -o out/${{ matrix.rid }}
      - name: Signing tool
        if: env.SIGN == 'true'
        run: dotnet tool install --global sign --version 1.1.5
      - name: Sign PCDoc.exe
        if: env.SIGN == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          sign code trusted-signing "out/${{ matrix.rid }}/PCDoc.exe"
          --trusted-signing-endpoint "${{ vars.SIGNING_ENDPOINT }}" --trusted-signing-account "${{ vars.SIGNING_ACCOUNT }}"
          --trusted-signing-certificate-profile "${{ vars.SIGNING_PROFILE }}"
      - name: Installer (MSI)
        shell: pwsh
        run: |
          dotnet build installer/PCDoc.Installer.wixproj -c Release -p:InstallerPlatform=$env:ARCH -p:AppDir="$PWD/out/${{ matrix.rid }}" -p:ProductVersion=$env:MSI_VERSION -o out/msi
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item out/msi/PCDoc.msi "PCDoc-$env:VERSION-$env:ARCH.msi"
      - name: Sign the installer
        if: env.SIGN == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: >
          sign code trusted-signing "PCDoc-${{ env.VERSION }}-${{ env.ARCH }}.msi"
          --trusted-signing-endpoint "${{ vars.SIGNING_ENDPOINT }}" --trusted-signing-account "${{ vars.SIGNING_ACCOUNT }}"
          --trusted-signing-certificate-profile "${{ vars.SIGNING_PROFILE }}"
      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path "out/${{ matrix.rid }}/*" -DestinationPath "PCDoc-$env:VERSION-portable-${{ matrix.rid }}.zip"
      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX --version 6.3.2
          dotnet CycloneDX src/PCDoc.App/PCDoc.App.csproj -o . -fn "sbom-${{ matrix.rid }}.cdx.json" -F Json -rs -sn PCDoc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: |
            PCDoc-*.zip
            PCDoc-*.msi
            sbom-*.cdx.json

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # seul ce job peut créer la version
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v7.0.0 (même génération que upload-artifact v7)
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum PCDoc-*.zip PCDoc-*.msi sbom-*.cdx.json > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # Une version « x.y.z-beta » reste une préversion : la mise à jour automatique ne la propose pas.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/PCDoc-*.zip
            dist/PCDoc-*.msi
            dist/SHA256SUMS.txt
            dist/sbom-*.cdx.json
